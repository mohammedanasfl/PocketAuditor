name: CI

# Every commit on every branch, every pull request, and on demand.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_evals:
        description: "Also run the evals against real Gemini (uses the GEMINI_API_KEY secret, costs API calls)"
        type: boolean
        default: false

# A newer push to the same branch cancels the older, still-running CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Settings() needs these at import time. Nothing here connects to Telegram,
# and only the `postgres` job (which overrides DATABASE_URL) uses a database.
env:
  DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
  TELEGRAM_BOT_TOKEN: "000000:ci-placeholder-token"
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint + types (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy app

  test:
    name: Unit + integration tests (pytest, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pytest (all offline — SQLite + mocked LLM/Telegram)
        run: pytest -q --cov=app --cov-report=term --cov-report=xml --cov-fail-under=85
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  evals:
    name: Offline evals (no LLM — unsafe must be 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Parser eval
        run: python -m evals.run --suite parser --provider none --fail-on-unsafe
      - name: Reconcile eval — pipeline engine
        run: python -m evals.run --suite reconcile --provider none --engine pipeline --fail-on-unsafe
      - name: Reconcile eval — agent engine
        run: python -m evals.run --suite reconcile --provider none --engine agent --fail-on-unsafe
      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-offline
          path: evals/results/

  postgres:
    name: Migrations + smoke test on real Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Migrate up
        run: alembic upgrade head
      - name: Migrate all the way down, then up again
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Models match the migrations
        run: alembic check
      - name: End-to-end smoke test (savings month, agent, approvals, audit)
        run: python -m scripts.postgres_smoke

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t pocketauditor:ci .
      - name: App imports inside the image (catches missing packages)
        run: >-
          docker run --rm
          -e DATABASE_URL="$DATABASE_URL"
          -e TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN"
          pocketauditor:ci python -c "import app.main; print('app imports OK')"

  live-evals:
    name: Live evals against Gemini (manual only)
    if: github.event_name == 'workflow_dispatch' && inputs.live_evals
    needs: [test, evals]
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-3.5-flash-lite
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Check the API key secret is set
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Add a GEMINI_API_KEY repository secret first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Parser eval (Gemini)
        run: python -m evals.run --suite parser --provider gemini --model "$LLM_MODEL" --fail-on-unsafe
      - name: Reconcile eval — agent engine (Gemini)
        run: python -m evals.run --suite reconcile --provider gemini --model "$LLM_MODEL" --engine agent --fail-on-unsafe
      - name: Reconcile eval — pipeline engine (Gemini)
        run: python -m evals.run --suite reconcile --provider gemini --model "$LLM_MODEL" --engine pipeline --fail-on-unsafe
      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-gemini
          path: evals/results/

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["^alembic/", "^tests/", "^scripts/"]

[[tool.mypy.overrides]]
module = "telegram.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# python-telegram-bot types Update.effective_chat/.message and
# Application.updater as Optional unconditionally, even though a registered
# command/message/callback handler and a builder-constructed Application
# guarantee them non-None in practice. Real Optional-narrowing bugs in this
# app's own logic (e.g. SQLAlchemy session.get() results) are handled with
# explicit asserts instead — see app/expenses.py, app/agent.py.
module = "app.telegram.handlers.*"
disable_error_code = ["union-attr"]
